name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    full-test:
        container:
            image: cuaesd/aesd-autotest:24-assignment4-buildroot
            # Keep the buildroot download and ccache directories across runs on the
            # self-hosted runner, the runner clears the container home on each job
            volumes:
              - /home/foster/.dl:/github/home/.dl
              - /home/foster/.buildroot-ccache:/github/home/.buildroot-ccache
        runs-on: self-hosted
        timeout-minutes: 300
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run: git submodule update --init --recursive
          - uses: webfactory/ssh-agent@v0.5.3
            with:
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          - name: Run full test
            env:
              GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
            run: ./full-test.sh
          - name: Cleanup
            if: always()
            run: |
              ssh-add -D
