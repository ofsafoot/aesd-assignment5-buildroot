name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    full-test:
        container:
            image: cuaesd/aesd-autotest:24-assignment5-buildroot
            # Keep the buildroot download and ccache directories across runs on the
            # self-hosted runner, the runner clears the container home on each job
            volumes:
              - /home/foster/.dl:/github/home/.dl
              - /home/foster/.buildroot-ccache:/github/home/.buildroot-ccache
              # Local copy of the buildroot repository, cloning it from gitlab
              # over this runner's network connection is unreliable
              - /home/foster/.buildroot-mirror.git:/github/home/buildroot-mirror.git:ro
        runs-on: self-hosted
        timeout-minutes: 300
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run: |
              if [ -f /github/home/buildroot-mirror.git/HEAD ]; then
                  echo "Using local buildroot mirror"
                  git config --global --add safe.directory '*'
                  git config --global protocol.file.allow always
                  git config --global url."file:///github/home/buildroot-mirror.git".insteadOf https://gitlab.com/buildroot.org/buildroot/
              fi
              git submodule update --init --recursive
          - uses: webfactory/ssh-agent@v0.5.3
            with:
                ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          - name: Run full test
            env:
              GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
            run: ./full-test.sh
          - name: Cleanup
            if: always()
            run: |
              ssh-add -D
